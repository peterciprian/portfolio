name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-docs:
    name: Build static portfolio
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-next
        run: npm ci --progress=false

      - name: Lint
        working-directory: portfolio-next
        run: npm run lint

      - name: Build GitHub Pages export
        working-directory: portfolio-next
        run: npm run build:github

      - name: Commit generated docs
        shell: pwsh
        run: |
          if (-not (git status --porcelain docs)) {
            Write-Host "No docs changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Build GitHub Pages site"
          git push